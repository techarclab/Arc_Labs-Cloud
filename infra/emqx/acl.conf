%% ARC Cloud: broker-local authorization for the ingest service (user arc-ingest), evaluated BEFORE the HTTP hook.
%%
%% Why it exists (DEF-014, 2026-11-12): EMQX 5.8.9 opens its listeners before the HTTP authorization source is usable,
%% so for a moment every check falls through to `no_match = deny`. The worker's SUBSCRIBE landed in that window, was
%% denied, `deny_action = disconnect` kicked it, and its resumed session then listed its subscriptions but delivered
%% nothing. This file has nothing to connect to, so the service is authorized from the first instant.
%%
%% It must grant exactly what authorizeIngestService() in packages/shared/src/acl.ts grants (checked by
%% packages/shared/test/emqx-acl.test.ts). Devices match no rule here and fall through to the HTTP hook as before.
%% Only the service can log in as arc-ingest: authentication checks MQTT_SERVICE_PASSWORD.
%% `eq` = the literal filter (with its wildcards), not a pattern. Shared subscriptions are checked by their topic.

{allow, {username, "arc-ingest"}, subscribe, [
    {eq, "arc/v1/+/+/+/telemetry"},
    {eq, "arc/v1/+/+/+/state"},
    {eq, "arc/v1/+/+/+/cmd-ack"},
    {eq, "$SYS/brokers/+/clients/+/connected"},
    {eq, "$SYS/brokers/+/clients/+/disconnected"}
]}.

{allow, {username, "arc-ingest"}, publish, [
    "arc/v1/+/+/+/cmd",
    {eq, "arc/v1/00000000-0000-0000-0000-000000000000/00000000-0000-0000-0000-000000000000/00000000-0000-0000-0000-000000000000/telemetry"}
]}.
