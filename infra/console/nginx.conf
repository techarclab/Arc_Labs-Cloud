# Serves the ARC Cloud web console and forwards /api to the backend container.
#
# NOTE: nginx only inherits `add_header` from the server block into a location that has NO add_header of
# its own. Every location below sets Cache-Control, so the security headers are repeated in each one
# (otherwise index.html would be served without them).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Hashed build assets can be cached for a long time.
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Single-page app: every other path loads index.html.
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    # The full policy is a <meta> tag injected at build (apps/console/vite.config.ts); these need a header.
    add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy same-origin-allow-popups always;
    try_files $uri /index.html;
  }
}
