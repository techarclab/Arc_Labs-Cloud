# Serves the ARC Cloud web console and forwards /api to the backend container. Runs as the unprivileged `nginx`
# user on port 8080 (Dockerfile.console), so a bug in nginx does not hand out root in the container.
#
# NOTE: nginx only inherits `add_header` from the server block into a location that has NO add_header of
# its own. Every location below sets Cache-Control, so the security headers are repeated in each one
# (otherwise index.html would be served without them).
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # Hashed build assets can be cached for a long time.
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options nosniff always;
    add_header Cross-Origin-Resource-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    try_files $uri =404;
  }

  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Single-page app: every other path loads index.html.
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    # The same policy as the <meta> tag injected at build (consoleCsp() in apps/console/vite.config.ts, for builds
    # without VITE_API_URL), plus frame-ancestors, which only works as a header. As a header it also applies before
    # the page is parsed. apps/console/test/csp.test.ts fails if the two drift apart.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; connect-src 'self' https://accounts.google.com/gsi/; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data: blob: https:; font-src 'self' data: https:; media-src 'self'; frame-src https://accounts.google.com/gsi/; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Cross-Origin-Resource-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # same-origin-allow-popups, not same-origin: Google sign-in's popup must be able to report back to this page.
    add_header Cross-Origin-Opener-Policy same-origin-allow-popups always;
    try_files $uri /index.html;
  }
}
