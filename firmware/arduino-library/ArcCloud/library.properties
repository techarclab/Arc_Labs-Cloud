name=ArcCloud
version=1.0.1
author=ARC LABS
maintainer=ARC LABS
sentence=Connect ESP32 boards to ARC Cloud: send sensor readings and react to dashboard switches over secure MQTT.
paragraph=A few lines per sketch: arc.begin(...), arc.add("temperature", t), arc.send(), arc.onControl("led1", ...). TLS with pinned public roots (no insecure mode), reconnects with back-off, optional credential provisioning over USB so no secret is compiled into the firmware.
category=Communication
url=https://arcloud.arclabs.in
architectures=esp32
depends=PubSubClient (>=2.8),ArduinoJson (>=7.0.0)
includes=ArcCloud.h
