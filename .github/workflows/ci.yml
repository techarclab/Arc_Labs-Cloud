name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: arc
          POSTGRES_PASSWORD: arc
          POSTGRES_DB: arc_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U arc" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build backend
        run: npm run build:backend
      - name: Type-check and build the web console
        run: npm run build -w @arc/console
      - name: Unit tests
        run: npm test
      - name: End-to-end tests (all phases)
        run: npx tsx tests/e2e/run.ts
        env:
          DATABASE_URL: postgres://arc:arc@127.0.0.1:5432/arc_ci
      - name: Backup and verified restore
        env:
          PGPASSWORD: arc
        run: |
          sudo apt-get install -y -q postgresql-client >/dev/null
          psql -h 127.0.0.1 -U arc -d arc_ci -c 'CREATE DATABASE arc_verify'
          bash infra/backup/backup.sh postgres://arc:arc@127.0.0.1:5432/arc_ci
          VERIFY_URL=postgres://arc:arc@127.0.0.1:5432/arc_verify bash infra/backup/verify.sh "$(ls -t backups/*.dump | head -1)"

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Dependency scan (fails on high/critical in production dependencies)
        run: npm audit --omit=dev --audit-level=high
      - name: No secrets committed
        run: |
          ! git ls-files | grep -E '(^|/)(\.env|device[^/]*\.json|railway-variables\.txt|.*-private\.pem)$|infra/certs/out/'

  firmware-crypto:
    # The device's OTA signature check (C/mbedTLS) must accept exactly what the signing tool and API produce.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get install -y -q libmbedtls-dev g++ >/dev/null
      - run: node tests/firmware/run.mjs

  firmware-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ARDUINO_CLI_VERSION: 1.5.1
      ESP32_CORE: 3.3.12
    steps:
      - uses: actions/checkout@v4
      - name: Install arduino-cli, ESP32 core and libraries (pinned)
        run: |
          curl -fsSL -o /tmp/cli.tgz "https://github.com/arduino/arduino-cli/releases/download/v${ARDUINO_CLI_VERSION}/arduino-cli_${ARDUINO_CLI_VERSION}_Linux_64bit.tar.gz"
          sudo tar xzf /tmp/cli.tgz -C /usr/local/bin arduino-cli
          arduino-cli config init --additional-urls "https://github.com/espressif/arduino-esp32/releases/download/${ESP32_CORE}/package_esp32_index.json"
          arduino-cli core update-index
          arduino-cli core install "esp32:esp32@${ESP32_CORE}"
          arduino-cli lib install "ArduinoJson@7.4.3" "PubSubClient@2.8" "DHT sensor library@1.4.7" "Adafruit Unified Sensor@1.1.15"
      - name: config.h from the template, with a throwaway P-256 OTA key
        run: |
          openssl ecparam -name prime256v1 -genkey -noout -out /tmp/k.pem
          openssl ec -in /tmp/k.pem -pubout -out /tmp/pub.pem
          python3 - <<'PY'
          placeholder = '-----BEGIN PUBLIC KEY-----\n...paste firmware-signing-public.pem here...\n-----END PUBLIC KEY-----'
          for d in ('arc_device', 'arc_dht_mqtt'):   # each sketch builds from its own template
              s = open(f'firmware/esp32-arduino/{d}/config.example.h').read()
              assert placeholder in s, d
              open(f'firmware/esp32-arduino/{d}/config.h', 'w').write(s.replace(placeholder, open('/tmp/pub.pem').read().strip()))
          PY
      - name: Compile every sketch (ESP32), and the OTA-capable ones for ESP32-S3
        run: |
          for s in arc_device arc_dht_mqtt arc_http arc_dht_sensor arc_hardware_test; do
            arduino-cli compile --warnings all -b esp32:esp32:esp32 "firmware/esp32-arduino/$s"
          done
          for s in arc_device arc_dht_mqtt arc_http; do
            arduino-cli compile --warnings all -b esp32:esp32:esp32s3 "firmware/esp32-arduino/$s"
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: ArcCloud library — its examples, and sketches made by the console's generator (ESP32 and ESP32-S3)
        run: |
          node --experimental-strip-types tools/gen-arduino-samples.ts /tmp/gen
          for board in esp32:esp32:esp32 esp32:esp32:esp32s3; do
            for s in firmware/arduino-library/ArcCloud/examples/* /tmp/gen/*; do
              arduino-cli compile --warnings all --library firmware/arduino-library/ArcCloud -b "$board" "$s"
            done
          done
          node tools/pack-arduino-library.mjs /tmp/zip && unzip -l /tmp/zip/ArcCloud-*.zip
      - name: Firmware must never skip TLS verification or put keys in URLs
        run: |
          ! grep -rn "setInsecure\|api_key=" firmware/esp32-arduino firmware/arduino-library --include=*.ino --include=*.h --include=*.cpp
      - name: Fleet images must not carry per-device credentials (arc_dht_mqtt provisions them over USB)
        run: |
          ! grep -nE "^#define +(WIFI_SSID|WIFI_PASSWORD|DEVICE_ID|DEVICE_PASSWORD|TOPIC_)" firmware/esp32-arduino/arc_dht_mqtt/config.example.h

  infra:
    # Terraform for the AWS pilot: formatting + validation against the real AWS provider schema (no credentials),
    # the production compose file, and the server scripts.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.13.2
      - name: Terraform fmt + validate
        run: |
          for s in bootstrap pilot; do
            (cd "infra/terraform/$s" && tofu fmt -check && tofu init -backend=false -input=false >/dev/null && tofu validate)
          done
      - name: Server scripts (shellcheck) and env writer
        run: |
          shellcheck -S warning deploy/aws/arc-deploy.sh deploy/aws/arc-cert-sync.sh deploy/aws/arc-os-patch.sh deploy/aws/arc-monitor.sh deploy/aws/teardown-pilot.sh deploy/aws/teardown-mgmt-staging.sh infra/emqx/entrypoint.sh
          # Calendar timers must parse; interval timers (OnUnitActiveSec, e.g. arc-monitor) have no OnCalendar line.
          for t in deploy/aws/*.timer; do
            c="$(sed -n 's/^OnCalendar=//p' "$t")"
            if [ -n "$c" ]; then systemd-analyze calendar "$c" >/dev/null; else grep -q '^OnUnitActiveSec=' "$t"; fi
          done
          # Every unit arc-deploy installs must exist in the repo.
          for f in $(grep -oE 'deploy/aws/[a-z-]+\.(sh|service|timer)' deploy/aws/arc-deploy.sh | sort -u); do test -f "$f" || { echo "missing $f"; exit 1; }; done
          python3 -m py_compile deploy/aws/write-env.py
      - name: Production compose file renders
        run: |
          sudo mkdir -p /etc/arc-cloud && sudo touch /etc/arc-cloud/{api,worker,emqx}.env
          ACME_EMAIL=a@example.com API_HOST=api.example.com MQTT_HOST=mqtt.example.com \
            docker compose -f deploy/aws/docker-compose.yml config --quiet
      - name: Oracle Always Free deployment (docs/deploy/oracle-free.md)
        run: |
          shellcheck -S warning deploy/oracle/*.sh deploy/oracle/postgres-init/*.sh
          python3 -m py_compile deploy/oracle/write-env.py
          # Regression: arc-deploy runs write-env under umask 077; the DB password must still be group-readable (0640).
          t="$(mktemp -d)"; mkdir "$t/conf"; printf 'CONSOLE_HOST=a.example.com\nAPI_HOST=b.example.com\nMQTT_HOST=c.example.com\n' > "$t/conf/config"
          (umask 077; ARC_CONF_DIR="$t/conf" ARC_DB_SECRET_DIR="$t/db" python3 deploy/oracle/write-env.py)
          test "$(stat -c %a "$t/db/password")" = 640 && test "$(stat -c %a "$t/conf/api.env")" = 600
          for t in deploy/oracle/*.timer; do systemd-analyze calendar "$(sed -n 's/^OnCalendar=//p' "$t")" >/dev/null; done
          for f in $(grep -oE 'deploy/(aws|oracle)/[a-z-]+\.(sh|service|timer)' deploy/oracle/arc-deploy.sh | sort -u); do test -f "$f" || { echo "missing $f"; exit 1; }; done
          export ACME_EMAIL=a@example.com API_HOST=api.example.com MQTT_HOST=mqtt.example.com CONSOLE_HOST=example.com
          docker compose -f deploy/oracle/docker-compose.yml config --quiet
          # Caddy's own parser, on both Caddyfiles (an invalid Caddyfile would stop the server's HTTPS at deploy time).
          for c in deploy/aws/Caddyfile deploy/oracle/Caddyfile; do
            docker run --rm -e ACME_EMAIL -e API_HOST -e MQTT_HOST -e CONSOLE_HOST -v "$PWD/$c:/etc/caddy/Caddyfile:ro" caddy:2.10 \
              caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          done

  images:
    # Builds the production images. The API/worker Dockerfile ends with tools/check-runtime-deps.cjs, so a
    # runtime dependency missing from the final image fails here instead of crash-looping on a server.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: API / worker image
        run: |
          docker build -f Dockerfile -t arc-cloud-api:ci .
          docker run --rm --entrypoint node arc-cloud-api:ci -e "require('zod'); require('pg'); console.log('ok')"

  supply-chain:
    # Trivy on every image the Oracle VM runs (application images built here, infrastructure images at the versions
    # in deploy/oracle/docker-compose.yml), the full npm lockfile including dev dependencies, and the Dockerfiles.
    # Trivy is installed as a pinned binary with a pinned SHA-256: its GitHub Actions (trivy-action, setup-trivy)
    # were compromised in March 2026 (GHSA-69fq-xp46-6x23), so they are not used.
    # Gate: application images fail on HIGH/CRITICAL with a fix available (production npm dependencies are already
    # gated by the security job). Upstream infrastructure images, dev dependencies and Dockerfile checks are
    # reported (job summary + artifact), not gated.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TRIVY_VERSION: 0.76.2
      TRIVY_SHA256: bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf
      TRIVY_CACHE_DIR: /tmp/trivy-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Install Trivy (pinned binary, verified checksum)
        run: |
          f="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSL -o "/tmp/$f" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/$f"
          echo "${TRIVY_SHA256}  /tmp/$f" | sha256sum -c -
          sudo tar -xzf "/tmp/$f" -C /usr/local/bin trivy
          trivy --version
      - name: Build application images, pull infrastructure images
        run: |
          docker build -q -f Dockerfile -t arc-cloud-api:scan .
          docker build -q -f Dockerfile.console -t arc-cloud-console:scan .
          docker build -q -f Dockerfile.emqx -t arc-cloud-emqx:scan .
          for i in $(grep -oE 'image: [^ ]+' deploy/oracle/docker-compose.yml | awk '{print $2}' | sort -u); do docker pull -q "$i"; echo "$i" >> /tmp/infra-images; done
          echo "Users the containers run as:"
          for i in arc-cloud-api:scan arc-cloud-console:scan arc-cloud-emqx:scan; do echo "  $i: $(docker run --rm --entrypoint id "$i" 2>&1 | head -1)"; done
      - name: Scan (reports)
        run: |
          mkdir -p security/out
          trivy image --quiet --format json --output security/out/image-api.json arc-cloud-api:scan
          trivy image --quiet --format json --output security/out/image-console.json arc-cloud-console:scan
          trivy image --quiet --format json --output security/out/image-emqx.json arc-cloud-emqx:scan
          while read -r i; do trivy image --quiet --format json --output "security/out/infra-$(echo "$i" | tr '/:' '__').json" "$i"; done < /tmp/infra-images
          trivy fs --quiet --scanners vuln --include-dev-deps --format json --output security/out/npm-all-deps.json package-lock.json
          trivy config --quiet --format json --output security/out/config.json --skip-dirs node_modules --skip-dirs infra/terraform .
          for i in api console; do trivy image --quiet --format cyclonedx --output "security/out/sbom-$i.cdx.json" "arc-cloud-$i:scan"; done
          npm audit --json > security/out/npm-audit-all.txt || true
          { echo '### Supply chain (Trivy '"$TRIVY_VERSION"')'; echo; node tools/trivy-summary.mjs security/out; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supply-chain
          path: security/out/
          retention-days: 30
      - name: Summary in the log too (artifact downloads may be unavailable to reviewers)
        if: always()
        run: |
          node tools/trivy-summary.mjs security/out
          for f in security/out/image-api.json security/out/image-console.json; do
            echo "== $f: HIGH/CRITICAL with a fix, and where they are"
            jq -r '.Results[]? | .Target as $t | .Vulnerabilities[]? | select((.Severity=="HIGH" or .Severity=="CRITICAL") and .FixedVersion) | "\(.Severity) \(.VulnerabilityID) \(.PkgName) \(.InstalledVersion) -> \(.FixedVersion)  [\(.PkgPath // $t)]"' "$f"
          done
          echo "== The API image must not ship npm:"; docker run --rm --entrypoint sh arc-cloud-api:scan -c 'command -v npm npx corepack || echo "none (good)"'
      - name: Gate, application images (HIGH/CRITICAL with a fix available)
        run: |
          trivy image --quiet --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL arc-cloud-api:scan
          trivy image --quiet --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL arc-cloud-console:scan
